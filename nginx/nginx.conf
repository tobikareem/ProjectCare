# CarePath reverse proxy and load balancer.
#
# Mounted at /etc/nginx/conf.d/default.conf, which replaces the stock server block that
# ships in the nginx image. This file is a server block, not a whole nginx.conf.
#
# No instance names or IPs appear anywhere: the API backend is found through Docker's
# embedded DNS, so `--scale carepath-api=N` works without editing or reloading this file.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS server. Every container on a user-defined network can reach
    # it, and it resolves a Compose service name to the addresses of all running
    # replicas. The short TTL is what lets scaling up or down become visible quickly.
    # ipv6=off avoids AAAA lookups that this network does not answer.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The hostname is held in a variable ON PURPOSE. With a literal hostname nginx
    # resolves once at startup and caches the addresses for the process lifetime, so new
    # replicas would never be seen and replaced ones would 502. A variable forces
    # resolution through the resolver above instead.
    set $carepath_api carepath-api;

    location / {
        # $request_uri is explicit because when proxy_pass contains a variable, nginx
        # does not append the original request URI automatically.
        proxy_pass http://$carepath_api:8080$request_uri;

        # Keep-alive to the backend and correct upgrade handling for later SignalR work.
        proxy_http_version 1.1;

        # Standard reverse-proxy headers. Without these the API only ever sees nginx.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Diagnostic only: reports which API container answered, so load distribution is
        # observable with `curl -sI`. Safe to delete once you have seen it working.
        add_header X-Upstream $upstream_addr always;
    }
}
